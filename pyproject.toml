[project]
name = "modernizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kevyn lucca", email = "kevynalternativo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "langfuse>=4.16.0",
    "langgraph>=1.2.12",
    "langgraph-cli[inmem]>=0.4.32",
    "pglast>=8.4",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.1",
]

[project.scripts]
modernizer = "modernizer:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
